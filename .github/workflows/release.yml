name: Release package

on:
  push:
    tags:
      - 'memoria-v*'
      - 'esi-v*'
      - 'meconfig-v*'
      - 'melse-v*'
      - 'mecm-v*'
      - 'metact-v*'
      - 'medt-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse package tag
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^(?<id>esi|meconfig|medt|melse|mecm|metact|memoria)-v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') { throw "Invalid release tag: $tag" }
          $projects = @{ esi = 'EventScriptInjector'; meconfig = 'ConfigurationManager'; medt = 'DebugTools'; melse = 'LootingSystemEnhanced'; mecm = 'CompanionManager'; metact = 'TacticsArchitect'; memoria = 'Memoria' }
          "id=$($Matches['id'])" >> $env:GITHUB_OUTPUT
          "project=$($projects[$Matches['id']])" >> $env:GITHUB_OUTPUT
          "tag_version=$($Matches['version'])" >> $env:GITHUB_OUTPUT

      - name: Verify project version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_FILE: Mods/${{ steps.package.outputs.project }}/${{ steps.package.outputs.project }}.proj
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_VERSION: ${{ steps.package.outputs.tag_version }}
        run: |
          $versionOutput = @(& dotnet msbuild $env:PROJECT_FILE -getProperty:Version -p:Configuration=Release -nologo | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw "Failed to read Version from '$env:PROJECT_FILE' through MSBuild." }
          if ($versionOutput.Count -ne 1) { throw "Expected MSBuild to return exactly one Version value for '$env:PROJECT_FILE'; received $($versionOutput.Count)." }
          $projectVersion = $versionOutput[0].Trim()
          if ($projectVersion -ne $env:TAG_VERSION) {
            $message = "Tag version '$env:TAG_VERSION' does not match project version '$projectVersion'."
            Write-Output "ERROR: $message"
            Write-Output "Deleting remote tag '$env:RELEASE_TAG'."
            $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$encodedTag"
            if ($LASTEXITCODE -ne 0) { throw "$message GitHub API tag deletion also failed with exit code $LASTEXITCODE." }
            throw $message
          }
          "version=$projectVersion" >> $env:GITHUB_OUTPUT

      - name: Build and publish package
        shell: pwsh
        run: dotnet msbuild "Mods/${{ steps.package.outputs.project }}/${{ steps.package.outputs.project }}.proj" -restore -t:Publish -p:Configuration=Release

      - name: Validate Steam Workshop manifest
        shell: pwsh
        run: |
          $manifest = 'artifacts/publish/${{ steps.package.outputs.id }}/${{ steps.version.outputs.version }}/steam-workshop.vdf'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Steam Workshop upload is not configured. Set WorkshopPublishedFileId in the mod project.' }

      - name: Restore clean SteamCMD
        id: steamcmd-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/steamcmd/cache
          key: steamcmd-windows-v1

      - name: Install clean SteamCMD
        if: steps.steamcmd-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = 'artifacts/steamcmd/steamcmd.zip'
          New-Item -ItemType Directory -Force 'artifacts/steamcmd/cache' | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/steamcmd/cache'
          $bootstrapSignature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/cache/steamcmd.exe'
          if ($bootstrapSignature.Status -ne 'Valid' -or $bootstrapSignature.SignerCertificate.Subject -notmatch '(^|, )O=Valve Corp\.(, |$)') { throw "SteamCMD bootstrap does not have a valid Valve signature: $($bootstrapSignature.Status); $($bootstrapSignature.SignerCertificate.Subject)" }
          Push-Location 'artifacts/steamcmd/cache'
          try {
            & .\steamcmd.exe +quit
            $updateExitCode = $LASTEXITCODE
            & .\steamcmd.exe +quit
            if ($LASTEXITCODE -ne 0) { throw "SteamCMD verification failed with exit code $LASTEXITCODE after the updater returned $updateExitCode." }
          }
          finally {
            Pop-Location
          }

      - name: Verify SteamCMD signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/cache/steamcmd.exe'
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|, )O=Valve Corp\.(, |$)') { throw "SteamCMD does not have a valid Valve signature: $($signature.Status); $($signature.SignerCertificate.Subject)" }

      # Save only the unauthenticated installation. SteamCMD login state must never enter Actions Cache.
      - name: Save clean SteamCMD
        if: steps.steamcmd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/steamcmd/cache
          key: steamcmd-windows-v1

      - name: Stage SteamCMD runtime copy
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'artifacts/steamcmd/cache' -Destination 'artifacts/steamcmd/runtime' -Recurse
          Push-Location 'artifacts/steamcmd/runtime'
          try {
            & .\steamcmd.exe +quit
            $updateExitCode = $LASTEXITCODE
            & .\steamcmd.exe +quit
            if ($LASTEXITCODE -ne 0) { throw "SteamCMD runtime verification failed with exit code $LASTEXITCODE after the updater returned $updateExitCode." }
          }
          finally {
            Pop-Location
          }
          $signature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/runtime/steamcmd.exe'
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|, )O=Valve Corp\.(, |$)') { throw "Updated SteamCMD does not have a valid Valve signature: $($signature.Status); $($signature.SignerCertificate.Subject)" }

      - name: Upload Steam Workshop item
        shell: pwsh
        env:
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STEAM_CONFIG_VDF_BASE64)) { throw 'STEAM_CONFIG_VDF_BASE64 is not configured.' }
          try {
            $configBytes = [Convert]::FromBase64String($env:STEAM_CONFIG_VDF_BASE64)
          }
          catch {
            throw 'STEAM_CONFIG_VDF_BASE64 is not valid Base64.'
          }
          finally {
            [Environment]::SetEnvironmentVariable('STEAM_CONFIG_VDF_BASE64', $null, 'Process')
          }
          $configText = [Text.Encoding]::UTF8.GetString($configBytes)
          $accountMatches = [regex]::Matches($configText, '(?ms)"Accounts"\s*\{\s*"(?<username>[^"]+)"\s*\{')
          if ($accountMatches.Count -ne 1) { throw "SteamCMD config must contain exactly one cached account; found $($accountMatches.Count)." }
          if ($configText -notmatch '(?m)^\s*"ConnectCache"\s*$') { throw 'SteamCMD config does not contain cached authentication data.' }
          $steamUsername = $accountMatches[0].Groups['username'].Value
          Write-Output "::add-mask::$steamUsername"
          $runtimeRoot = (Resolve-Path -LiteralPath 'artifacts/steamcmd/runtime').Path
          $configDirectory = Join-Path $runtimeRoot 'config'
          New-Item -ItemType Directory -Force $configDirectory | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $configDirectory 'config.vdf'), $configBytes)
          [Array]::Clear($configBytes, 0, $configBytes.Length)
          $configText = $null
          $manifest = (Resolve-Path -LiteralPath 'artifacts/publish/${{ steps.package.outputs.id }}/${{ steps.version.outputs.version }}/steam-workshop.vdf').Path
          Push-Location $runtimeRoot
          try {
            & .\steamcmd.exe '+@ShutdownOnFailedCommand' 1 '+@NoPromptForPassword' 1 +login $steamUsername +workshop_build_item $manifest +quit
            if ($LASTEXITCODE -ne 0) { throw "Steam Workshop upload failed with exit code $LASTEXITCODE." }
          }
          finally {
            Pop-Location
          }

      - name: Remove authenticated SteamCMD runtime
        if: always()
        shell: pwsh
        run: if (Test-Path -LiteralPath 'artifacts/steamcmd/runtime') { Remove-Item -LiteralPath 'artifacts/steamcmd/runtime' -Recurse -Force }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.id }}-${{ steps.version.outputs.version }}
          path: artifacts/publish/${{ steps.package.outputs.id }}/${{ steps.version.outputs.version }}
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/publish/${{ steps.package.outputs.id }}/${{ steps.version.outputs.version }}/nexus/*.zip
