name: Release package

on:
  push:
    tags:
      - 'memoria-v*'
      - 'esi-v*'
      - 'meconfig-v*'
      - 'melse-v*'
      - 'mecm-v*'
      - 'metact-v*'
      - 'medt-v*'

permissions:
  contents: write

concurrency:
  # Build.PublishAllTags.cmd waits for each run before pushing the next tag. This lock also protects Stable and all-in-one from independently pushed tags.
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      id: ${{ steps.package.outputs.id }}
      project: ${{ steps.package.outputs.project }}
      version: ${{ steps.version.outputs.version }}
      display_name: ${{ steps.version.outputs.display_name }}
      update_date: ${{ steps.version.outputs.update_date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse package tag
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^(?<id>esi|meconfig|medt|melse|mecm|metact|memoria)-v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') { throw "Invalid release tag: $tag" }
          $projects = @{ esi = 'EventScriptInjector'; meconfig = 'ConfigurationManager'; medt = 'DebugTools'; melse = 'LootingSystemEnhanced'; mecm = 'CompanionManager'; metact = 'TacticsArchitect'; memoria = 'Memoria' }
          "id=$($Matches['id'])" >> $env:GITHUB_OUTPUT
          "project=$($projects[$Matches['id']])" >> $env:GITHUB_OUTPUT
          "tag_version=$($Matches['version'])" >> $env:GITHUB_OUTPUT

      - name: Verify project version
        id: version
        shell: pwsh
        env:
          PROJECT_FILE: Mods/${{ steps.package.outputs.project }}/${{ steps.package.outputs.project }}.proj
          TAG_VERSION: ${{ steps.package.outputs.tag_version }}
        run: |
          $versionOutput = @(& dotnet msbuild $env:PROJECT_FILE -getProperty:Version -p:Configuration=Release -nologo | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw "Failed to read Version from '$env:PROJECT_FILE' through MSBuild." }
          if ($versionOutput.Count -ne 1) { throw "Expected MSBuild to return exactly one Version value for '$env:PROJECT_FILE'; received $($versionOutput.Count)." }
          $projectVersion = $versionOutput[0].Trim()
          if ($projectVersion -ne $env:TAG_VERSION) { throw "Tag version '$env:TAG_VERSION' does not match project version '$projectVersion'." }
          $displayNameOutput = @(& dotnet msbuild $env:PROJECT_FILE -getProperty:ModDisplayName -p:Configuration=Release -nologo | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0 -or $displayNameOutput.Count -ne 1) { throw "Failed to read ModDisplayName from '$env:PROJECT_FILE' through MSBuild." }
          "version=$projectVersion" >> $env:GITHUB_OUTPUT
          "display_name=$($displayNameOutput[0].Trim())" >> $env:GITHUB_OUTPUT
          "update_date=$([DateTime]::UtcNow.ToString('yyyy-MM-dd'))" >> $env:GITHUB_OUTPUT

      - name: Build and publish package
        shell: pwsh
        run: dotnet msbuild "Mods/${{ steps.package.outputs.project }}/${{ steps.package.outputs.project }}.proj" -restore -t:Publish -p:Configuration=Release -verbosity:minimal

      - name: Validate publish output
        shell: pwsh
        run: |
          $packageRoot = 'artifacts/publish/${{ steps.package.outputs.id }}/${{ steps.version.outputs.version }}'
          if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'steam-workshop.vdf') -PathType Leaf)) { throw 'Steam Workshop upload manifest was not generated.' }
          if (@(Get-ChildItem -LiteralPath (Join-Path $packageRoot 'nexus') -Filter '*.zip' -File).Count -ne 1) { throw 'Publish must generate exactly one Nexus archive.' }

      - name: Stage package for parallel publishing
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: artifacts/publish/${{ steps.package.outputs.id }}/${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 1

  workshop:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download prepared package
        uses: actions/download-artifact@v7
        with:
          name: release-package
          path: artifacts/publish/${{ needs.prepare.outputs.id }}/${{ needs.prepare.outputs.version }}

      - name: Restore clean SteamCMD
        id: steamcmd-cache
        uses: actions/cache/restore@v6
        with:
          path: artifacts/steamcmd/cache
          key: steamcmd-windows-v1

      - name: Install clean SteamCMD
        if: steps.steamcmd-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = 'artifacts/steamcmd/steamcmd.zip'
          New-Item -ItemType Directory -Force 'artifacts/steamcmd/cache' | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/steamcmd/cache'
          $bootstrapSignature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/cache/steamcmd.exe'
          $bootstrapSignerName = if ($null -eq $bootstrapSignature.SignerCertificate) { '' } else { $bootstrapSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) }
          if ($bootstrapSignature.Status -ne 'Valid' -or $bootstrapSignerName -notin @('Valve', 'Valve Corp.')) { throw "SteamCMD bootstrap does not have a valid Valve signature: $($bootstrapSignature.Status); signer=$bootstrapSignerName; subject=$($bootstrapSignature.SignerCertificate.Subject)" }
          Push-Location 'artifacts/steamcmd/cache'
          try {
            & .\steamcmd.exe +quit
            $updateExitCode = $LASTEXITCODE
            & .\steamcmd.exe +quit
            if ($LASTEXITCODE -ne 0) { throw "SteamCMD verification failed with exit code $LASTEXITCODE after the updater returned $updateExitCode." }
          }
          finally {
            Pop-Location
          }

      - name: Verify SteamCMD signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/cache/steamcmd.exe'
          $signerName = if ($null -eq $signature.SignerCertificate) { '' } else { $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) }
          if ($signature.Status -ne 'Valid' -or $signerName -notin @('Valve', 'Valve Corp.')) { throw "SteamCMD does not have a valid Valve signature: $($signature.Status); signer=$signerName; subject=$($signature.SignerCertificate.Subject)" }

      - name: Save clean SteamCMD
        if: steps.steamcmd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: artifacts/steamcmd/cache
          key: steamcmd-windows-v1

      - name: Stage SteamCMD runtime copy
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'artifacts/steamcmd/cache' -Destination 'artifacts/steamcmd/runtime' -Recurse
          Push-Location 'artifacts/steamcmd/runtime'
          try {
            & .\steamcmd.exe +quit
            $updateExitCode = $LASTEXITCODE
            & .\steamcmd.exe +quit
            if ($LASTEXITCODE -ne 0) { throw "SteamCMD runtime verification failed with exit code $LASTEXITCODE after the updater returned $updateExitCode." }
          }
          finally {
            Pop-Location
          }
          $signature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/runtime/steamcmd.exe'
          $signerName = if ($null -eq $signature.SignerCertificate) { '' } else { $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) }
          if ($signature.Status -ne 'Valid' -or $signerName -notin @('Valve', 'Valve Corp.')) { throw "Updated SteamCMD does not have a valid Valve signature: $($signature.Status); signer=$signerName; subject=$($signature.SignerCertificate.Subject)" }

      - name: Upload Steam Workshop item
        shell: pwsh
        env:
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STEAM_CONFIG_VDF_BASE64)) { throw 'STEAM_CONFIG_VDF_BASE64 is not configured.' }
          try {
            $configBytes = [Convert]::FromBase64String($env:STEAM_CONFIG_VDF_BASE64)
          }
          catch {
            throw 'STEAM_CONFIG_VDF_BASE64 is not valid Base64.'
          }
          finally {
            [Environment]::SetEnvironmentVariable('STEAM_CONFIG_VDF_BASE64', $null, 'Process')
          }
          $configText = [Text.Encoding]::UTF8.GetString($configBytes)
          $accountMatches = [regex]::Matches($configText, '(?ms)"Accounts"\s*\{\s*"(?<username>[^"]+)"\s*\{')
          if ($accountMatches.Count -ne 1) { throw "SteamCMD config must contain exactly one cached account; found $($accountMatches.Count)." }
          if ($configText -notmatch '(?m)^\s*"ConnectCache"\s*$') { throw 'SteamCMD config does not contain cached authentication data.' }
          $steamUsername = $accountMatches[0].Groups['username'].Value
          Write-Output "::add-mask::$steamUsername"
          $runtimeRoot = (Resolve-Path -LiteralPath 'artifacts/steamcmd/runtime').Path
          $configDirectory = Join-Path $runtimeRoot 'config'
          New-Item -ItemType Directory -Force $configDirectory | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $configDirectory 'config.vdf'), $configBytes)
          [Array]::Clear($configBytes, 0, $configBytes.Length)
          $configText = $null
          $manifest = (Resolve-Path -LiteralPath 'artifacts/publish/${{ needs.prepare.outputs.id }}/${{ needs.prepare.outputs.version }}/steam-workshop.vdf').Path
          Push-Location $runtimeRoot
          try {
            $steamOutput = @(& .\steamcmd.exe '+@ShutdownOnFailedCommand' 1 '+@NoPromptForPassword' 1 +login $steamUsername +workshop_build_item $manifest +quit 2>&1)
            $steamExitCode = $LASTEXITCODE
            $sanitizedSteamOutput = [regex]::Replace(($steamOutput -join [Environment]::NewLine), '\[U:(?<universe>\d+):\d+\]', '[U:${universe}:***]')
            if (-not [string]::IsNullOrWhiteSpace($sanitizedSteamOutput)) { Write-Output $sanitizedSteamOutput }
            if ($steamExitCode -ne 0) { throw "Steam Workshop upload failed with exit code $steamExitCode." }
          }
          finally {
            Pop-Location
          }

      - name: Remove authenticated SteamCMD runtime
        if: always()
        shell: pwsh
        run: if (Test-Path -LiteralPath 'artifacts/steamcmd/runtime') { Remove-Item -LiteralPath 'artifacts/steamcmd/runtime' -Recurse -Force }

  github_release:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download prepared package
        uses: actions/download-artifact@v7
        with:
          name: release-package
          path: artifacts/publish/${{ needs.prepare.outputs.id }}/${{ needs.prepare.outputs.version }}

      - name: Update Stable release
        shell: pwsh
        env:
          DISPLAY_NAME: ${{ needs.prepare.outputs.display_name }}
          GH_TOKEN: ${{ github.token }}
          MOD_ID: ${{ needs.prepare.outputs.id }}
          PACKAGE_ROOT: artifacts/publish/${{ needs.prepare.outputs.id }}/${{ needs.prepare.outputs.version }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          UPDATE_DATE: ${{ needs.prepare.outputs.update_date }}
        run: |
          & ./.github/scripts/Update-StableRelease.ps1 -PackageRoot $env:PACKAGE_ROOT -ModId $env:MOD_ID -DisplayName $env:DISPLAY_NAME -Version $env:PACKAGE_VERSION -UpdateDate $env:UPDATE_DATE -Repository $env:RELEASE_REPOSITORY

  cleanup:
    needs:
      - prepare
      - workshop
      - github_release
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.workshop.result == 'failure' || needs.github_release.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Write-Output "Deleting remote tag '$env:RELEASE_TAG' after release failure."
          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$encodedTag"
          if ($LASTEXITCODE -ne 0) { throw "Failed to delete release tag '$env:RELEASE_TAG' through the GitHub API." }
