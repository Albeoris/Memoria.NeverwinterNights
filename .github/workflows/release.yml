name: Release all packages

on:
  push:
    tags:
      - latest

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      update_time: ${{ steps.time.outputs.update_time }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Capture update time
        id: time
        shell: pwsh
        run: |
          "update_time=$([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm', [Globalization.CultureInfo]::InvariantCulture)) UTC" >> $env:GITHUB_OUTPUT

      - name: Build and publish all packages
        shell: pwsh
        run: dotnet msbuild Memoria.NeverwinterNights.slnx -restore -t:Publish -p:Configuration=Release -m:1 -verbosity:minimal

      - name: Validate publish output
        shell: pwsh
        run: |
          [xml] $solution = Get-Content -LiteralPath 'Memoria.NeverwinterNights.slnx' -Raw
          $projects = @($solution.SelectNodes('/Solution/Folder/Project[starts-with(@Path, "Mods/")]'))
          foreach ($solutionProject in $projects) {
            $projectPath = $solutionProject.GetAttribute('Path')
            [xml] $project = Get-Content -LiteralPath $projectPath -Raw
            $modId = $project.SelectSingleNode('/Project/PropertyGroup[not(@Condition)]/ModId[not(@Condition)]').InnerText.Trim().ToLowerInvariant()
            $version = $project.SelectSingleNode('/Project/PropertyGroup[not(@Condition)]/Version[not(@Condition)]').InnerText.Trim()
            $packageRoot = "artifacts/publish/$modId/$version"
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'steam-workshop.vdf') -PathType Leaf)) { throw "Steam Workshop manifest was not generated for $modId $version." }
            if (@(Get-ChildItem -LiteralPath (Join-Path $packageRoot 'nexus') -Filter '*.zip' -File).Count -ne 1) { throw "Publish must generate exactly one Nexus archive for $modId $version." }
          }

      - name: Stage all packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 1

  workshop:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download prepared packages
        uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: artifacts/publish

      - name: Restore clean SteamCMD
        id: steamcmd-cache
        uses: actions/cache/restore@v6
        with:
          path: artifacts/steamcmd/cache
          key: steamcmd-windows-v1

      - name: Install clean SteamCMD
        if: steps.steamcmd-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = 'artifacts/steamcmd/steamcmd.zip'
          New-Item -ItemType Directory -Force 'artifacts/steamcmd/cache' | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/steamcmd/cache'
          $bootstrapSignature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/cache/steamcmd.exe'
          $bootstrapSignerName = if ($null -eq $bootstrapSignature.SignerCertificate) { '' } else { $bootstrapSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) }
          if ($bootstrapSignature.Status -ne 'Valid' -or $bootstrapSignerName -notin @('Valve', 'Valve Corp.')) { throw "SteamCMD bootstrap does not have a valid Valve signature: $($bootstrapSignature.Status); signer=$bootstrapSignerName; subject=$($bootstrapSignature.SignerCertificate.Subject)" }
          Push-Location 'artifacts/steamcmd/cache'
          try {
            & .\steamcmd.exe +quit
            $updateExitCode = $LASTEXITCODE
            & .\steamcmd.exe +quit
            if ($LASTEXITCODE -ne 0) { throw "SteamCMD verification failed with exit code $LASTEXITCODE after the updater returned $updateExitCode." }
          }
          finally {
            Pop-Location
          }

      - name: Verify SteamCMD signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/cache/steamcmd.exe'
          $signerName = if ($null -eq $signature.SignerCertificate) { '' } else { $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) }
          if ($signature.Status -ne 'Valid' -or $signerName -notin @('Valve', 'Valve Corp.')) { throw "SteamCMD does not have a valid Valve signature: $($signature.Status); signer=$signerName; subject=$($signature.SignerCertificate.Subject)" }

      - name: Save clean SteamCMD
        if: steps.steamcmd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: artifacts/steamcmd/cache
          key: steamcmd-windows-v1

      - name: Stage SteamCMD runtime copy
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'artifacts/steamcmd/cache' -Destination 'artifacts/steamcmd/runtime' -Recurse
          Push-Location 'artifacts/steamcmd/runtime'
          try {
            & .\steamcmd.exe +quit
            $updateExitCode = $LASTEXITCODE
            & .\steamcmd.exe +quit
            if ($LASTEXITCODE -ne 0) { throw "SteamCMD runtime verification failed with exit code $LASTEXITCODE after the updater returned $updateExitCode." }
          }
          finally {
            Pop-Location
          }
          $signature = Get-AuthenticodeSignature -LiteralPath 'artifacts/steamcmd/runtime/steamcmd.exe'
          $signerName = if ($null -eq $signature.SignerCertificate) { '' } else { $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) }
          if ($signature.Status -ne 'Valid' -or $signerName -notin @('Valve', 'Valve Corp.')) { throw "Updated SteamCMD does not have a valid Valve signature: $($signature.Status); signer=$signerName; subject=$($signature.SignerCertificate.Subject)" }

      - name: Upload all Steam Workshop items
        shell: pwsh
        env:
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STEAM_CONFIG_VDF_BASE64)) { throw 'STEAM_CONFIG_VDF_BASE64 is not configured.' }
          try {
            $configBytes = [Convert]::FromBase64String($env:STEAM_CONFIG_VDF_BASE64)
          }
          catch {
            throw 'STEAM_CONFIG_VDF_BASE64 is not valid Base64.'
          }
          finally {
            [Environment]::SetEnvironmentVariable('STEAM_CONFIG_VDF_BASE64', $null, 'Process')
          }
          $configText = [Text.Encoding]::UTF8.GetString($configBytes)
          $accountMatches = [regex]::Matches($configText, '(?ms)"Accounts"\s*\{\s*"(?<username>[^"]+)"\s*\{')
          if ($accountMatches.Count -ne 1) { throw "SteamCMD config must contain exactly one cached account; found $($accountMatches.Count)." }
          if ($configText -notmatch '(?m)^\s*"ConnectCache"\s*$') { throw 'SteamCMD config does not contain cached authentication data.' }
          $steamUsername = $accountMatches[0].Groups['username'].Value
          Write-Output "::add-mask::$steamUsername"
          $runtimeRoot = (Resolve-Path -LiteralPath 'artifacts/steamcmd/runtime').Path
          $configDirectory = Join-Path $runtimeRoot 'config'
          New-Item -ItemType Directory -Force $configDirectory | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $configDirectory 'config.vdf'), $configBytes)
          [Array]::Clear($configBytes, 0, $configBytes.Length)
          $configText = $null
          $manifests = @(Get-ChildItem -LiteralPath 'artifacts/publish' -Filter 'steam-workshop.vdf' -File -Recurse | Sort-Object FullName)
          if ($manifests.Count -eq 0) { throw 'No Steam Workshop manifests were downloaded.' }
          Write-Output "Steam Workshop upload order ($($manifests.Count) items):"
          for ($index = 0; $index -lt $manifests.Count; $index++) {
            $manifest = $manifests[$index]
            $manifestText = [IO.File]::ReadAllText($manifest.FullName, [Text.Encoding]::UTF8)
            $titleMatch = [regex]::Match($manifestText, '(?m)^\s*"title"\s+"(?<value>[^"]*)"\s*$')
            $publishedFileIdMatch = [regex]::Match($manifestText, '(?m)^\s*"publishedfileid"\s+"(?<value>\d+)"\s*$')
            $title = if ($titleMatch.Success) { $titleMatch.Groups['value'].Value } else { '<unknown title>' }
            $publishedFileId = if ($publishedFileIdMatch.Success) { $publishedFileIdMatch.Groups['value'].Value } else { '<unknown ID>' }
            Write-Output "[$($index + 1)] $title (Workshop ID: $publishedFileId): $($manifest.FullName)"
          }
          $steamArguments = @('+@ShutdownOnFailedCommand', '1', '+@NoPromptForPassword', '1', '+login', $steamUsername)
          foreach ($manifest in $manifests) {
            $steamArguments += '+workshop_build_item'
            $steamArguments += $manifest.FullName
          }
          $steamArguments += '+quit'
          Push-Location $runtimeRoot
          try {
            $steamOutput = @(& .\steamcmd.exe @steamArguments 2>&1)
            $steamExitCode = $LASTEXITCODE
            $sanitizedSteamOutput = [regex]::Replace(($steamOutput -join [Environment]::NewLine), '\[U:(?<universe>\d+):\d+\]', '[U:${universe}:***]')
            if (-not [string]::IsNullOrWhiteSpace($sanitizedSteamOutput)) { Write-Output $sanitizedSteamOutput }
            if ($steamExitCode -ne 0) { throw "Steam Workshop upload failed with exit code $steamExitCode." }
          }
          finally {
            Pop-Location
          }

      - name: Remove authenticated SteamCMD runtime
        if: always()
        shell: pwsh
        run: if (Test-Path -LiteralPath 'artifacts/steamcmd/runtime') { Remove-Item -LiteralPath 'artifacts/steamcmd/runtime' -Recurse -Force }

  github_release:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download prepared packages
        uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: artifacts/publish

      - name: Publish Latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          UPDATE_TIME: ${{ needs.prepare.outputs.update_time }}
        run: |
          & ./.github/scripts/Update-StableRelease.ps1 -PublishRoot 'artifacts/publish' -UpdateTime $env:UPDATE_TIME -Repository $env:RELEASE_REPOSITORY
