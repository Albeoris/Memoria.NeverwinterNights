name: API Snapshots

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: api-snapshots
  cancel-in-progress: false

jobs:
  create-api-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create immutable API snapshot tags
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          $allProjects = @(Get-ChildItem Mods -Recurse -Filter *.proj)
          $referencedProjects = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($consumerProject in $allProjects) {
              [xml] $consumerXml = Get-Content -LiteralPath $consumerProject.FullName -Raw
              foreach ($dependencyNode in @($consumerXml.SelectNodes('/Project/ItemGroup/NwnRequiredPackage[@Include]'))) {
                  $dependencyInclude = $dependencyNode.GetAttribute('Include').Replace('\', [IO.Path]::DirectorySeparatorChar).Replace('/', [IO.Path]::DirectorySeparatorChar)
                  $dependencyPath = [IO.Path]::GetFullPath([IO.Path]::Combine($consumerProject.DirectoryName, $dependencyInclude))
                  if (-not (Test-Path -LiteralPath $dependencyPath -PathType Leaf)) {
                      throw "$($consumerProject.FullName) references missing dependency project $dependencyPath."
                  }
                  $referencedProjects.Add($dependencyPath) | Out-Null
              }
          }

          $createdTags = @()
          $legacyTagsToDelete = @()
          foreach ($project in $allProjects | Where-Object { $referencedProjects.Contains($_.FullName) }) {
              Write-Host "Checking $($project.FullName)"
              [xml] $xml = Get-Content -LiteralPath $project.FullName -Raw
              $modIdNodes = @($xml.SelectNodes('/Project/PropertyGroup[not(@Condition)]/ModId[not(@Condition)]'))
              $versionNodes = @($xml.SelectNodes('/Project/PropertyGroup[not(@Condition)]/Version[not(@Condition)]'))
              if ($modIdNodes.Count -ne 1 -or $versionNodes.Count -ne 1) {
                  throw "$($project.FullName) must declare exactly one unconditional ModId and Version."
              }
              $modId = $modIdNodes[0].InnerText.Trim()
              $version = $versionNodes[0].InnerText.Trim()
              if ($modId -notmatch '^[A-Za-z0-9._-]+$') {
                  throw "Invalid ModId in $($project.FullName): $modId"
              }
              if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
                  throw "Mod version must use X.Y.Z notation in $($project.FullName): $version"
              }

              $tag = "api-$($modId.ToLowerInvariant())-v$version"
              $legacyTag = "$($modId.ToLowerInvariant())-api-v$version"
              git show-ref --verify --quiet "refs/tags/$tag"
              $tagLookupExitCode = $LASTEXITCODE
              if ($tagLookupExitCode -notin 0, 1) {
                  throw "Failed to check whether API snapshot tag $tag exists."
              }
              $global:LASTEXITCODE = 0
              $tagExists = $tagLookupExitCode -eq 0
              git show-ref --verify --quiet "refs/tags/$legacyTag"
              $legacyTagLookupExitCode = $LASTEXITCODE
              if ($legacyTagLookupExitCode -notin 0, 1) {
                  throw "Failed to check whether legacy API snapshot tag $legacyTag exists."
              }
              $global:LASTEXITCODE = 0
              $legacyTagExists = $legacyTagLookupExitCode -eq 0
              if ($tagExists) {
                  Write-Host "$tag already exists."
                  if ($legacyTagExists) {
                      $tagCommit = (git rev-list -n 1 $tag).Trim()
                      $legacyTagCommit = (git rev-list -n 1 $legacyTag).Trim()
                      if ($tagCommit -ne $legacyTagCommit) {
                          throw "Cannot replace $legacyTag with $tag because they reference different commits."
                      }
                      $legacyTagsToDelete += $legacyTag
                  }
                  continue
              }

              $targetCommit = $env:GITHUB_SHA
              if ($legacyTagExists) {
                  $targetCommit = (git rev-list -n 1 $legacyTag).Trim()
                  $legacyTagsToDelete += $legacyTag
                  Write-Host "Replacing $legacyTag with $tag at $targetCommit"
              }
              else {
                  Write-Host "Creating $tag at $targetCommit"
              }
              git tag --annotate $tag $targetCommit --message "API snapshot for $modId $version"
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create $tag."
              }
              $createdTags += $tag
          }

          foreach ($tag in $createdTags) {
              Write-Host "Pushing $tag"
              git push origin $tag
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to push $tag."
              }
          }

          foreach ($legacyTag in $legacyTagsToDelete) {
              Write-Host "Deleting legacy API tag $legacyTag"
              $encodedTag = [Uri]::EscapeDataString($legacyTag)
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$encodedTag"
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to delete legacy API tag $legacyTag."
              }
          }
